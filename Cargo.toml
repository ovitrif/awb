[workspace]
resolver = "2"
members = ["crates/awb-core", "crates/awb", "crates/awb-app", "crates/menu-icon"]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ovitrif/awb"

[workspace.dependencies]
awb-core = { path = "crates/awb-core" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = "0.28"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
