[package]
name = "awb-app"
description = "awb (Android Wireless Bridge) macOS menu bar app."
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true

[[bin]]
name = "awb-app"
path = "src/main.rs"

[dependencies]
awb-core.workspace = true
anyhow.workspace = true
eframe = "0.34"
egui-phosphor = "0.12"
kurbo = "0.13"
serde.workspace = true
tiny-skia = "0.12"
toml = "0.9"
# Published as `tray-icon`; aliased so our code never references "tray".
menu-icon = { package = "tray-icon", version = "0.24" }
winit = "0.30"
