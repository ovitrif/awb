[package]
name = "awb-app"
description = "awb (Android Wifi Bridge) macOS menu bar app."
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true
repository.workspace = true

[[bin]]
name = "awb-app"
path = "src/main.rs"

[dependencies]
awb-core.workspace = true
anyhow.workspace = true
eframe = "0.34"
egui-phosphor = "0.12"
kurbo = "0.13"
serde.workspace = true
tiny-skia = "0.12"
toml = "0.9"
menu-icon = { path = "../menu-icon" }
winit = "0.30"
egui_kittest = { version = "0.34.3", features = ["eframe", "wgpu"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
# Headless drive mode: renders the UI offscreen and takes commands over a
# Unix socket, for agents and scripts to verify screens (see AGENTS.md).
drive = ["dep:egui_kittest", "dep:image"]

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSEvent",
    "NSMenu",
    "NSResponder",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
] }
raw-window-handle = "0.6"
